<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Aitor Skills cinematic starfield">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06070a"/>
      <stop offset="55%" stop-color="#0b0f1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#1f2a44" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0b1020" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#05070d" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <style>
      .stars-1 { animation: drift 24s linear infinite; }
      .stars-2 { animation: drift 36s linear infinite; }
      .stars-3 { animation: drift 52s linear infinite; }
      .twinkle { animation: twinkle 6s ease-in-out infinite; }
      .title { font: 700 44px/1.1 "Trebuchet MS", "Segoe UI", sans-serif; letter-spacing: 2px; }
      .subtitle { font: 400 14px/1.6 "Segoe UI", sans-serif; letter-spacing: 3px; }
      @keyframes drift {
        from { transform: translateX(0px); }
        to { transform: translateX(-160px); }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.9; }
      }
    </style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#glow)"/>

  <g opacity="0.9">
    <circle cx="980" cy="70" r="120" fill="#0b1020" filter="url(#soft)"/>
    <circle cx="240" cy="320" r="140" fill="#0b1020" filter="url(#soft)"/>
  </g>

  <g class="stars-1" opacity="0.6">
    <circle cx="120" cy="60" r="1.6" fill="#cbd5e1"/>
    <circle cx="260" cy="120" r="1.2" fill="#94a3b8"/>
    <circle cx="380" cy="80" r="2.1" fill="#e2e8f0"/>
    <circle cx="540" cy="140" r="1.4" fill="#cbd5e1"/>
    <circle cx="720" cy="110" r="1.8" fill="#e2e8f0"/>
    <circle cx="940" cy="150" r="1.1" fill="#94a3b8"/>
    <circle cx="1080" cy="90" r="2.2" fill="#f8fafc"/>
  </g>

  <g class="stars-2" opacity="0.7">
    <circle cx="80" cy="220" r="1.2" fill="#cbd5e1"/>
    <circle cx="210" cy="260" r="1.7" fill="#e2e8f0"/>
    <circle cx="360" cy="210" r="1.1" fill="#94a3b8"/>
    <circle cx="520" cy="260" r="2.0" fill="#f1f5f9"/>
    <circle cx="690" cy="230" r="1.3" fill="#cbd5e1"/>
    <circle cx="860" cy="260" r="1.8" fill="#e2e8f0"/>
    <circle cx="1020" cy="230" r="1.0" fill="#94a3b8"/>
  </g>

  <g class="stars-3" opacity="0.5">
    <circle cx="160" cy="340" r="1.5" fill="#cbd5e1"/>
    <circle cx="310" cy="360" r="1.0" fill="#94a3b8"/>
    <circle cx="480" cy="330" r="1.9" fill="#f8fafc"/>
    <circle cx="650" cy="360" r="1.2" fill="#cbd5e1"/>
    <circle cx="820" cy="330" r="2.1" fill="#e2e8f0"/>
    <circle cx="980" cy="350" r="1.1" fill="#94a3b8"/>
    <circle cx="1120" cy="320" r="1.7" fill="#f8fafc"/>
  </g>

  <g class="twinkle">
    <circle cx="460" cy="40" r="1.5" fill="#f8fafc"/>
    <circle cx="860" cy="40" r="1.5" fill="#f8fafc"/>
    <circle cx="620" cy="200" r="1.8" fill="#f8fafc"/>
  </g>

  <g>
    <text x="90" y="190" fill="#e5e7eb" class="title">AITOR SKILLS</text>
    <text x="90" y="225" fill="#94a3b8" class="subtitle">LIVING SYSTEM • REFINED OVER TIME</text>
  </g>

  <g opacity="0.25">
    <path d="M0 300 C 220 260, 420 330, 620 300 S 980 310, 1200 280" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
    <path d="M0 315 C 260 285, 470 350, 720 315 S 1020 320, 1200 300" fill="none" stroke="#475569" stroke-width="1"/>
  </g>
</svg>
